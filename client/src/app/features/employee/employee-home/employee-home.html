@if (!isSignedIn) {
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Employee Clock In</mat-card-title>
      <mat-card-subtitle>Location: {{ locationCode }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="login()" class="form">
        <mat-form-field appearance="outline">
          <mat-label>6-Digit Code</mat-label>
          <input
            matInput
            name="userCode"
            [(ngModel)]="userCode"
            maxlength="6"
            required
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="off"
          />
        </mat-form-field>
        @if (error()) {
          <p class="error">{{ error() }}</p>
        }
        <button mat-flat-button color="primary" type="submit" [disabled]="loading()">Login</button>
      </form>
    </mat-card-content>
  </mat-card>
} @else {
  <mat-card>
    <mat-card-content>
      <h1 class="welcome-title">Welcome, {{ auth.session()?.firstName }}</h1>
      <p class="location-label">{{ locationCode }}</p>
    </mat-card-content>
  </mat-card>

  <app-pay-day-banner />

  <div class="schedule-section">
    <h2 class="section-title">This Week's Schedule</h2>
    <app-current-week-schedule [locationCode]="locationCode" />
  </div>
}
