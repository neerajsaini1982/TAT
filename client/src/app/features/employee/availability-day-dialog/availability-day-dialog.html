<h2 mat-dialog-title>{{ data.dayLabel }} <span class="date">{{ data.dateLabel }}</span></h2>

<mat-dialog-content>
  <mat-slide-toggle [(ngModel)]="isAvailable" [class.toggle-unavailable]="!isAvailable">
    {{ isAvailable ? 'Available' : 'Not Available' }}
  </mat-slide-toggle>

  @if (isAvailable) {
    <div class="time-section">
      <mat-slide-toggle [(ngModel)]="allDay">All day</mat-slide-toggle>
      @if (!allDay) {
        <!-- Plain text, not <input type="time"> — see the comment above
             startTime in the component for why. list="availabilityDayTimeSuggestions"
             just offers autocomplete off a shared <datalist>; it doesn't
             restrict what can be typed. -->
        <datalist id="availabilityDayTimeSuggestions">
          @for (t of timeSuggestions; track t) {
            <option [value]="t"></option>
          }
        </datalist>
        <div class="time-row">
          <mat-form-field appearance="outline" class="time-field">
            <mat-label>Start</mat-label>
            <input matInput type="text" list="availabilityDayTimeSuggestions" [(ngModel)]="startTime" [ngModelOptions]="{ updateOn: 'blur' }" placeholder="h:mm AM/PM" (focus)="startTouched = true" />
          </mat-form-field>
          <span class="time-sep">–</span>
          <mat-form-field appearance="outline" class="time-field">
            <mat-label>End</mat-label>
            <input matInput type="text" list="availabilityDayTimeSuggestions" [(ngModel)]="endTime" [ngModelOptions]="{ updateOn: 'blur' }" placeholder="h:mm AM/PM" (focus)="endTouched = true" />
          </mat-form-field>
        </div>
      }
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
