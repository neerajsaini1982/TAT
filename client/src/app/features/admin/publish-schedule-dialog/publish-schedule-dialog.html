<h2 mat-dialog-title>Publish schedule?</h2>
<mat-dialog-content class="content">
  <p>The schedule for {{ data.weekRangeLabel }} will become visible to employees on their My Schedule page.</p>
  <mat-checkbox [(ngModel)]="sendEmail">Email employees their schedule</mat-checkbox>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="confirm()">Publish</button>
</mat-dialog-actions>
