<h2 mat-dialog-title>Change Password</h2>
<mat-dialog-content class="content">
  <mat-form-field appearance="outline" class="field">
    <mat-label>Current Password</mat-label>
    <input matInput type="password" name="currentPassword" autocomplete="current-password" [(ngModel)]="currentPassword" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="field">
    <mat-label>New Password</mat-label>
    <input matInput type="password" name="newPassword" autocomplete="new-password" [(ngModel)]="newPassword" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="field">
    <mat-label>Confirm New Password</mat-label>
    <input matInput type="password" name="confirmPassword" autocomplete="new-password" [(ngModel)]="confirmPassword" />
  </mat-form-field>
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="saving()">Save</button>
</mat-dialog-actions>
