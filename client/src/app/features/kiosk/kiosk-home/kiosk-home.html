@if (!isSignedIn) {
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Kiosk Clock In</mat-card-title>
      <mat-card-subtitle>Location: {{ locationCode }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="login()" class="form">
        <mat-form-field appearance="outline">
          <mat-label>Kiosk Passcode</mat-label>
          <input matInput type="password" name="passcode" [(ngModel)]="passcode" required />
        </mat-form-field>
        @if (error()) {
          <p class="error">{{ error() }}</p>
        }
        <button mat-flat-button color="primary" type="submit" [disabled]="loading()">Log In</button>
      </form>
    </mat-card-content>
  </mat-card>
} @else {
  <div class="kiosk-header">
    <h1 class="welcome-title">{{ auth.locationName() }} Kiosk</h1>
    <button mat-stroked-button type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      End Kiosk Session
    </button>
  </div>

  <app-kiosk-schedule [locationCode]="locationCode" />
}
