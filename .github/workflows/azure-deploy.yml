name: Test and deploy to Azure

# Tests run on every pull request (whatever branch it targets, so stacked PRs
# are covered) and on every push to main. Only main / a manual run deploys.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tat

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run server tests
        run: dotnet test server.Tests -c Release

  # Skipped on pull requests, and never starts unless the tests pass. Secrets
  # are only used here, so a PR run (including one from a fork) never sees them.
  build-and-deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Build Angular client
        run: |
          npm ci
          npx ng build
        working-directory: client

      - name: Copy client build into server/wwwroot
        run: |
          rm -rf server/wwwroot
          mkdir -p server/wwwroot
          cp -R client/dist/client/browser/. server/wwwroot/

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish server
        run: dotnet publish server -c Release -o publish

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
